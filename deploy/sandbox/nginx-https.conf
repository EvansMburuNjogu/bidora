geo $bidora_sandbox_internal {
    default 0;
    172.30.42.0/24 1;
}
map $bidora_sandbox_internal $bidora_sandbox_forwarded_for {
    default $remote_addr;
    1 $http_x_forwarded_for;
}
server {
    listen 80;
    listen [::]:80;
    server_name sandbox.bidora.africa api-sandbox.bidora.africa;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /opt/bidora-sandbox/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name sandbox.bidora.africa;
    ssl_certificate /etc/letsencrypt/live/bidora-sandbox/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bidora-sandbox/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/bidora-sandbox-cloudflare.conf;
    access_log off;
    error_log /var/log/nginx/bidora-sandbox-error.log crit;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Bidora-Client-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 150s;
        proxy_buffering off;
    }
}
server {
    listen 443 ssl;
    server_name api-sandbox.bidora.africa;
    ssl_certificate /etc/letsencrypt/live/bidora-sandbox/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bidora-sandbox/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/bidora-sandbox-cloudflare.conf;
    access_log off;
    error_log /var/log/nginx/bidora-sandbox-error.log crit;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $bidora_sandbox_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 150s;
    }
}
